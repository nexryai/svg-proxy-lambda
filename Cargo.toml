[package]
name = "svg-proxy-lambda"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
axum = "0.8.9"
bytes = "1"
futures-util = "0.3"
ipnet = "2"
png = "0.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
resvg = "0.48.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
] }
tokio-stream = "0.1"
